services:
  grpc:
    build:
      context: .
    command: python -m app.grpc.main
    ports:
      - "50051:50051"
    volumes:
      - .:/app
    environment:
      APP_ENV: local
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: 50051
      DATABASE_URL: postgresql+psycopg://recommendation_user:change_me_local_only@postgres:5432/recommendation_service
      QDRANT_URL: http://qdrant:6333
      AUTH_SERVICE_GRPC_ADDR: host.docker.internal:50052
      AUTH_SERVICE_URL: http://host.docker.internal:8081
      AUTH_JWKS_URL: http://host.docker.internal:8081/.well-known/jwks.json
      SURVEY_SERVICE_GRPC_ADDR: host.docker.internal:50053
      SURVEY_SERVICE_URL: http://host.docker.internal:8082
      MAP_SERVICE_GRPC_ADDR: host.docker.internal:50054
      MAP_SERVICE_URL: http://host.docker.internal:8083
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  api:
    build:
      context: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      APP_ENV: local
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+psycopg://recommendation_user:change_me_local_only@postgres:5432/recommendation_service
      QDRANT_URL: http://qdrant:6333
      AUTH_SERVICE_GRPC_ADDR: host.docker.internal:50052
      AUTH_SERVICE_URL: http://host.docker.internal:8081
      AUTH_JWKS_URL: http://host.docker.internal:8081/.well-known/jwks.json
      SURVEY_SERVICE_GRPC_ADDR: host.docker.internal:50053
      SURVEY_SERVICE_URL: http://host.docker.internal:8082
      MAP_SERVICE_GRPC_ADDR: host.docker.internal:50054
      MAP_SERVICE_URL: http://host.docker.internal:8083
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: recommendation_service
      POSTGRES_USER: recommendation_user
      POSTGRES_PASSWORD: change_me_local_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommendation_user -d recommendation_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
