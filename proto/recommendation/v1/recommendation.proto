syntax = "proto3";

package ontheblock.recommendation.v1;

option java_package = "com.ontheblock.recommendation.v1";
option java_multiple_files = true;
option go_package = "github.com/ontheblock/infra/proto/recommendation/v1;recommendationv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// RecommendationService returns deterministic recommendation results.
//
// Auth flow:
// - Gateway validates JWT and forwards authenticated metadata.
// - recommendation-service resolves identity from auth metadata.
// - Clients must not provide user_id or external_user_id in public requests.
service RecommendationService {
  rpc GetProfileStatus(GetProfileStatusRequest) returns (GetProfileStatusResponse);
  rpc GetBeverageRecommendations(GetBeverageRecommendationsRequest)
      returns (GetBeverageRecommendationsResponse);
  rpc GetVenueRecommendations(GetVenueRecommendationsRequest)
      returns (GetVenueRecommendationsResponse);
  rpc RecordRecommendationEvent(RecordRecommendationEventRequest)
      returns (RecordRecommendationEventResponse);
}

enum ProfileStatus {
  PROFILE_STATUS_UNSPECIFIED = 0;
  PROFILE_STATUS_MISSING = 1;
  PROFILE_STATUS_PENDING_GENERATION = 2;
  PROFILE_STATUS_ACTIVE = 3;
  PROFILE_STATUS_STALE = 4;
  PROFILE_STATUS_FAILED_GENERATION = 5;
}

enum BudgetMode {
  BUDGET_MODE_UNSPECIFIED = 0;
  BUDGET_MODE_SOFT = 1;
  BUDGET_MODE_STRICT = 2;
}

enum BeverageDiversityMode {
  BEVERAGE_DIVERSITY_MODE_UNSPECIFIED = 0;
  BEVERAGE_DIVERSITY_MODE_STANDARD = 1;
  BEVERAGE_DIVERSITY_MODE_DIFFERENT = 2;
  BEVERAGE_DIVERSITY_MODE_ADJACENT = 3;
}

enum BeverageFlavorDirection {
  BEVERAGE_FLAVOR_DIRECTION_UNSPECIFIED = 0;
  BEVERAGE_FLAVOR_DIRECTION_SWEETER = 1;
  BEVERAGE_FLAVOR_DIRECTION_LESS_SWEET = 2;
  BEVERAGE_FLAVOR_DIRECTION_SMOKIER = 3;
  BEVERAGE_FLAVOR_DIRECTION_LESS_SMOKY = 4;
  BEVERAGE_FLAVOR_DIRECTION_LIGHTER = 5;
  BEVERAGE_FLAVOR_DIRECTION_RICHER = 6;
  BEVERAGE_FLAVOR_DIRECTION_MORE_HERBAL_BITTER = 7;
  BEVERAGE_FLAVOR_DIRECTION_BRIGHTER_FRUITY = 8;
}

enum RecommendationEventType {
  RECOMMENDATION_EVENT_TYPE_UNSPECIFIED = 0;
  RECOMMENDATION_EVENT_TYPE_IMPRESSION = 1;
  RECOMMENDATION_EVENT_TYPE_CLICK = 2;
  RECOMMENDATION_EVENT_TYPE_SAVE = 3;
  RECOMMENDATION_EVENT_TYPE_DISMISS = 4;
  RECOMMENDATION_EVENT_TYPE_DETAIL_VIEW = 5;
}

enum VenueOptionType {
  VENUE_OPTION_TYPE_UNSPECIFIED = 0;
  VENUE_OPTION_TYPE_NEAREST_REASONABLE = 1;
  VENUE_OPTION_TYPE_BEST_PRICE = 2;
  VENUE_OPTION_TYPE_BALANCED_BEST = 3;
}

enum VenueAvailabilityStatus {
  VENUE_AVAILABILITY_STATUS_UNSPECIFIED = 0;
  VENUE_AVAILABILITY_STATUS_AVAILABLE = 1;
  VENUE_AVAILABILITY_STATUS_LIKELY_AVAILABLE = 2;
  VENUE_AVAILABILITY_STATUS_UNKNOWN = 3;
  VENUE_AVAILABILITY_STATUS_UNAVAILABLE = 4;
}

enum VenueFreshnessStatus {
  VENUE_FRESHNESS_STATUS_UNSPECIFIED = 0;
  VENUE_FRESHNESS_STATUS_FRESH = 1;
  VENUE_FRESHNESS_STATUS_STALE = 2;
  VENUE_FRESHNESS_STATUS_EXPIRED = 3;
}

message GetProfileStatusRequest {}

message GetProfileStatusResponse {
  ProfileStatus status = 1;
  int32 profile_revision = 2;
  string survey_response_id = 3;
  google.protobuf.Timestamp generated_at = 4;
  string stale_reason = 5;
}

message GetBeverageRecommendationsRequest {
  string category = 1;
  int32 limit = 2;
  BudgetMode budget_mode = 3;
  repeated string exclude_beverage_ids = 4;
  repeated string exclude_result_ids = 5;
  BeverageDiversityMode diversity_mode = 6;
  BeverageFlavorDirection flavor_direction = 7;
}

message BeverageRecommendation {
  int32 rank = 1;
  string result_id = 2;
  string beverage_id = 3;
  string name_ko = 4;
  string name_en = 5;
  string category = 6;
  double score = 7;
  repeated string reason_codes = 8;
  string explanation = 9;
  google.protobuf.Struct metadata = 10;
}

message GetBeverageRecommendationsResponse {
  string request_id = 1;
  ProfileStatus profile_status = 2;
  int32 profile_revision = 3;
  repeated BeverageRecommendation recommendations = 4;
}

message GetVenueRecommendationsRequest {
  string selected_beverage_id = 1;
  double lat = 2;
  double lng = 3;
  int32 radius_m = 4;
  int32 limit = 5;
  BudgetMode budget_mode = 6;
  repeated string place_types = 7;
}

message VenueRecommendation {
  int32 rank = 1;
  string result_id = 2;
  string place_id = 3;
  string name = 4;
  string place_type = 5;
  string address = 6;
  VenueOptionType option_type = 7;
  double distance_m = 8;
  optional int32 price_krw = 9;
  VenueAvailabilityStatus availability_status = 10;
  VenueFreshnessStatus freshness_status = 11;
  double score = 12;
  repeated string reason_codes = 13;
  string explanation = 14;
  google.protobuf.Struct metadata = 15;
}

message GetVenueRecommendationsResponse {
  string request_id = 1;
  ProfileStatus profile_status = 2;
  int32 profile_revision = 3;
  repeated VenueRecommendation recommendations = 4;
}

message RecordRecommendationEventRequest {
  string request_id = 1;
  string result_id = 2;
  RecommendationEventType event_type = 3;
  string idempotency_key = 4;
  google.protobuf.Struct metadata = 5;
}

message RecordRecommendationEventResponse {
  string interaction_id = 1;
  bool duplicate = 2;
}
